      /* 首屏在 JS 之前就要显示，所以配色写字面值，不依赖后面才加载的 CSS 变量 */
      .app-splash {
        --splash-paper: #faf8f5;
        --splash-ink: #211f1d;
        --splash-muted: #6f6862;

        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background-color: var(--splash-paper);
        color: var(--splash-ink);
        font-family:
          -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        transition: opacity 0.42s ease;
      }

      .app-splash.dark {
        --splash-paper: #171514;
        --splash-ink: #eae4dc;
        --splash-muted: #97908a;
      }

      .app-splash.is-leaving {
        opacity: 0;
        pointer-events: none;
      }

      .app-splash__mark {
        width: 56px;
        height: 56px;
        animation: splash-breathe 2.4s ease-in-out infinite;
      }

      .app-splash__name {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.32em;
        text-indent: 0.32em;
      }

      .app-splash__tagline {
        margin-top: -12px;
        font-size: 13px;
        letter-spacing: 0.02em;
        color: var(--splash-muted);
      }

      .app-splash__status {
        position: absolute;
        bottom: 12%;
        font-size: 12.5px;
        color: var(--splash-muted);
      }

      .app-splash__status::after {
        content: '';
        animation: splash-dots 1.6s steps(4, end) infinite;
      }

      .app-splash__timeout {
        position: absolute;
        bottom: 7%;
        display: none;
        max-width: 30em;
        padding: 0 1.5em;
        font-size: 12.5px;
        line-height: 1.7;
        text-align: center;
        color: #b93a26;
      }

      @keyframes splash-breathe {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.72;
          transform: scale(0.955);
        }
      }

      @keyframes splash-dots {
        0% {
          content: '';
        }
        25% {
          content: '.';
        }
        50% {
          content: '..';
        }
        75% {
          content: '...';
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-splash__mark {
          animation: none;
        }
      }
    </style>
