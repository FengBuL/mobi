name: 主题 / 板块问题
description: 换主题、点选换板块、单独处理还原，和预期不符。
title: 主题或板块问题
labels: [theme-block]
body:
  - type: markdown
    attributes:
      value: |
        已单独处理的板块换主题后保持自己的颜色，这是预期。科技 / 中式预览不再画贴不进的纹路，也是预期。
  - type: dropdown
    id: theme
    attributes:
      label: 主题名
      options:
        - 专栏
        - 科技
        - 教程
        - 克制
        - 中式
        - 更多里的其他主题（请在描述里写名字）
    validations:
      required: true
  - type: dropdown
    id: image-host
    attributes:
      label: 是否配了图床
      options:
        - 没有配
        - 配了公众号素材库
        - 配了其他图床
        - 与本题无关
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 哪一类
      options:
        - 换主题
        - 点选换板块
        - 单独处理 / 还原为普通文本
        - 其他
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 写你点了什么、看见了什么、期望是什么。
    validations:
      required: true
  - type: input
    id: preview-shot
    attributes:
      label: 墨笔预览截图
    validations:
      required: true
  - type: input
    id: editor-shot
    attributes:
      label: 公众号后台截图
      description: 若问题只在编辑器、还没复制，写「未贴」并仍附预览图。
    validations:
      required: true
