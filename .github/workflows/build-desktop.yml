name: Build Desktop App

# 三个平台各跑一次完整打包，产物挂成 artifact。
# 不挂在每次 push 上：一次要下三份 Electron 运行时，太贵，需要时手动触发或者打 tag。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      # 一个平台挂了，另外两个的产物照样要拿到，好判断是平台相关还是代码本身的问题
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            artifact: mobi-macos
          - os: windows-latest
            target: win
            artifact: mobi-windows
          - os: ubuntu-latest
            target: linux
            artifact: mobi-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # 仓库的 .npmrc 把 Electron 二进制指到了国内镜像，GitHub 的机器上直接回官方源更快
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/v

      - name: Package
        run: pnpm --filter @md/desktop package:${{ matrix.target }}
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/v

      # 签名对不上 bundle 时，Apple Silicon 会判「已损坏」并拒绝打开，
      # 而这在装了应用的开发机上看不出来——本地跑的时候隔离属性早被摘掉了。
      # 所以让 CI 在产物出厂前自己验一遍，签名坏了就别发出去。
      - name: Verify macOS signature
        if: matrix.target == 'mac'
        run: |
          for app in apps/desktop/release/mac*/*.app; do
            echo "检查 $app"
            codesign --verify --deep --strict --verbose=2 "$app"
          done

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage

  # 三个平台各自建 release 会打架，所以等全部构建完再统一发一个
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: installers/*
          body: |
            下载对应系统的安装包即可，不想装的话可以直接用[网页版](https://fengbul.github.io/mobi/)。

            | 系统 | 下载 |
            | --- | --- |
            | macOS（Apple 芯片） | `mobi-*-arm64.dmg` |
            | macOS（Intel） | `mobi-*-x64.dmg` |
            | Windows | `mobi-*-x64.exe` |
            | Linux | `mobi-*-x64.AppImage` |

            安装包还没有签名：macOS 首次打开要右键选「打开」，Windows 会弹一次 SmartScreen 警告。
