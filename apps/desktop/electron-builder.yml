appId: com.fengbul.mobi
productName: 墨笔
copyright: Copyright © 2026 墨笔

directories:
  output: release
  buildResources: build

# 主进程、preload、渲染产物都已经打进 dist，运行时不依赖 node_modules 里的任何东西
files:
  - dist/**
asar: true
npmRebuild: false

# 产物名走 ASCII：productName 是中文，直接进文件名会给下载和 CI 制品带来一堆转义问题
artifactName: mobi-${version}-${arch}.${ext}

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  # 没有开发者证书，但不能不签：Apple Silicon 要求所有代码都有能对上 bundle 的签名，
  # 对不上系统会直接判「已损坏」并拒绝打开，那比「无法验证开发者」严重得多——后者右键还能打开。
  # 这里走 ad-hoc 签名，不需要证书也不花钱，afterPack 里补一刀确保签名贴合最终产物。
  identity: '-'
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  title: 墨笔 ${version}

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: 墨笔

linux:
  category: Office
  # 不写的话会从包名 @mobi/desktop 推出 @mddesktop，@ 在文件路径里非法，构建直接失败。
  # macOS 和 Windows 用的是 productName，所以只有这里需要显式给一个 ASCII 名字
  executableName: mobi
  # 让窗口能关联到桌面项，否则任务栏里认不出来是哪个应用
  synopsis: 写完就能贴进公众号的 Markdown 排版编辑器
  desktop:
    entry:
      Name: 墨笔
      StartupWMClass: mobi
  target:
    - target: AppImage
      arch:
        - x64
