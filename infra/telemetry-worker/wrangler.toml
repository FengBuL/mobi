name = "mobi-telemetry"
main = "worker.js"
compatibility_date = "2026-08-01"

# 先运行 `wrangler d1 create mobi-telemetry`，把输出的 database_id 填到下面
[[d1_databases]]
binding = "DB"
database_name = "mobi-telemetry"
database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

# 反馈转 GitHub Issue 的仓库；配了 GITHUB_TOKEN secret 才会真的建
[vars]
GITHUB_REPO = "FengBuL/mobi"
